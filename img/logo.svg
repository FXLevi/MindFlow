<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A73E8"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4"/>
      <stop offset="100%" style="stop-color:#0097A7"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500;700&amp;display=swap');
    </style>
  </defs>

  <!-- ===== ICON MARK ===== -->
  <!-- Outer circle (person silhouette base) -->
  <circle cx="80" cy="80" r="56" fill="url(#accentGrad)"/>

  <!-- Head -->
  <circle cx="80" cy="60" r="14" fill="white"/>

  <!-- Body arc -->
  <path d="M52 102 Q52 82 80 82 Q108 82 108 102" fill="white"/>

  <!-- Kanban columns overlay (right side of circle) -->
  <rect x="92" y="74" width="6" height="22" rx="2" fill="url(#tealGrad)" opacity="0.9"/>
  <rect x="100" y="69" width="6" height="27" rx="2" fill="url(#tealGrad)" opacity="0.75"/>
  <rect x="108" y="78" width="6" height="18" rx="2" fill="url(#tealGrad)" opacity="0.6"/>

  <!-- Checkmark badge -->
  <circle cx="116" cy="44" r="12" fill="#00BCD4"/>
  <polyline points="109,44 114,49 123,38" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== WORDMARK ===== -->
  <!-- "TaskFlow" in strong weight -->
  <text x="158" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#0D2545">Mind</text>
  <text x="263" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="300" letter-spacing="-1" fill="#1A73E8">Flow</text>

  <!-- Tagline -->
  <text x="159" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="3.5" fill="#607D8B">RH · GESTÃO DE PESSOAS</text>

  <!-- Separator line under tagline -->
  <line x1="159" y1="108" x2="390" y2="108" stroke="#E0E7EF" stroke-width="1"/>

  <!-- Sub-label -->
  <text x="159" y="126" font-family="Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#90A4AE">Organize. Acompanhe. Conclua.</text>
</svg>